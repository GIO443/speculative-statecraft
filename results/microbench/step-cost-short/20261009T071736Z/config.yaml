name: step-cost-short
description: 'Follow-up to step-cost: the k=1 verification cost (n-gram k=1, no GPU
  draft compute) grew with batch size on ~4.3k-token prompts. Same batches with ~150-token
  prompts separate per-request overhead (sampling, rejection, bookkeeping; independent
  of context) from attention over the context with 2 query tokens per request (proportional
  to context).

  '
model_config_path: configs/models/qwen2.5-1.5b-instruct-bf16.yaml
game_turn: data/collect/qwen2.5-1.5b/run2/games/n32_s109.jsonl#3
max_message_chars: 200
temperature: 0.7
seed: 0
request_timeout_s: 600.0
server:
  port: 8000
  gpu_memory_utilization: 0.7
  max_model_len: 8192
  extra_flags:
  - --enable-prefix-caching
  - --compilation-config
  - '{"max_cudagraph_capture_size": 128}'
  startup_timeout_s: 900.0
  volumes:
  - speculative-statecraft_spec-data:/data
phases:
- kind: decode
  name: decode-short
  batch_sizes:
  - 1
  - 4
  - 16
  - 32
  guided: false
  max_tokens: 64
  fixed_length: true
  repeats: 2
  prompts: ticket_json
- kind: decode
  name: decode-long
  batch_sizes:
  - 1
  - 4
  - 16
  - 32
  guided: false
  max_tokens: 64
  fixed_length: true
  repeats: 2
  prompts: game_turn
servers:
- name: none
  extra_flags: []
  phases:
  - decode-short
  - decode-long
- name: ngram-k1
  extra_flags:
  - --speculative-config
  - '{"method": "ngram", "num_speculative_tokens": 1, "prompt_lookup_min": 2, "prompt_lookup_max":
    5}'
  phases:
  - decode-short
  - decode-long
