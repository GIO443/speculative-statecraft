name: spec-validate
description: >
  Online check of the trained EAGLE-1 head against its offline acceptance estimate, with
  n-gram as reference. Eval seed 0 (never trained on). Short; not the Phase 4 sweep.
model_config_path: configs/models/qwen2.5-1.5b-instruct-bf16.yaml   # in statecraft-serving
game_config_path: configs/game/default.yaml

server:
  port: 8000
  gpu_memory_utilization: 0.8
  max_model_len: 16384
  extra_flags: ["--enable-prefix-caching"]
  startup_timeout_s: 900
  volumes: ["speculative-statecraft_spec-data:/data"]

agent:
  faction_max_tokens: 160
  narrator_max_tokens: 200
  temperature: 0.7
  guided_decoding: true
  faction_priority: null
  narrator_priority: null
  narrator: sequential

run:
  faction_counts: [4, 16, 64]
  repeats: 1
  seeds: [0]
  turns: 4
  warmup_turns: 1
  server_warmup_factions: 4
  server_warmup_turns: 1
  server_warmup_seed: 1000
  request_timeout_s: 600
  metrics_interval_s: 1.0
  stall_timeout_s: 180

variants:
  - name: baseline              # no speculation
  - name: eagle1
    extra_flags: ["--speculative-config", '{"method": "eagle", "model": "/data/heads/eagle1-qwen2.5-1.5b-20261004T004139Z", "num_speculative_tokens": 3}']
  - name: ngram
    extra_flags: ["--speculative-config", '{"method": "ngram", "num_speculative_tokens": 3, "prompt_lookup_min": 2, "prompt_lookup_max": 5}']
