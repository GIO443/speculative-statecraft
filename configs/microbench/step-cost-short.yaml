name: step-cost-short
description: >
  Follow-up to step-cost: the k=1 verification cost (n-gram k=1, no GPU draft compute) grew
  with batch size on ~4.3k-token prompts. Same batches with ~150-token prompts separate
  per-request overhead (sampling, rejection, bookkeeping; independent of context) from
  attention over the context with 2 query tokens per request (proportional to context).
model_config_path: configs/models/qwen2.5-1.5b-instruct-bf16.yaml   # in statecraft-serving
game_turn: data/collect/qwen2.5-1.5b/run2/games/n32_s109.jsonl#3    # held-out seed, mid-game, ~4.3k-token prompts
max_message_chars: 200
temperature: 0.7
seed: 0
request_timeout_s: 600

server:
  port: 8000
  # The sweeps use util 0.8, max_model_len 16384 and the default CUDA graph sizes (up to 512).
  # Only ~5.8 GiB of VRAM was free (other apps), so to fit 32 concurrent ~4.3k-token requests
  # with speculation on, every server here (baseline included) uses: util 0.70, max_model_len
  # 8192 (longest request ~4.5k), and CUDA graphs up to 128 tokens (= batch 32 x (k=3 + 1)).
  # Servers are only compared with each other in this run.
  gpu_memory_utilization: 0.70
  max_model_len: 8192
  extra_flags: ["--enable-prefix-caching", "--compilation-config", '{"max_cudagraph_capture_size": 128}']
  startup_timeout_s: 900
  volumes: ["speculative-statecraft_spec-data:/data"]

phases:
  - {kind: decode, name: decode-short, batch_sizes: [1, 4, 16, 32], guided: false, max_tokens: 64, fixed_length: true, repeats: 2, prompts: ticket_json}
  - {kind: decode, name: decode-long, batch_sizes: [1, 4, 16, 32], guided: false, max_tokens: 64, fixed_length: true, repeats: 2}

servers:
  - name: none
    phases: [decode-short, decode-long]
  - name: ngram-k1
    extra_flags: ["--speculative-config", '{"method": "ngram", "num_speculative_tokens": 1, "prompt_lookup_min": 2, "prompt_lookup_max": 5}']
    phases: [decode-short, decode-long]
